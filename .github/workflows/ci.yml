name: SMS diagnostics isolated Ubuntu validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: SMS diagnostics ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            ref: ed6213632a50f0749b312f272d6407de3fcb863c
          - label: patched
            ref: 6e535b703946fdbfedda78c1fec5f90cfb779624
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_sms_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=8192
      NODE_NO_WARNINGS: "1"
      SKIP_AVATAR_CLONE: "1"
      ELIZA_NO_VISION_DEPS: "1"
      ELIZA_SKIP_FUSED_INFERENCE_SETUP: "1"
      RUN_TURBO_CONCURRENCY: "1"
      LOGIN_TEST_DATABASE_URL: postgres://postgres:local_sms_test@127.0.0.1:5432/postgres
      PATCH_HEAD: 6e535b703946fdbfedda78c1fec5f90cfb779624
      CASE_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.15.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Record exact source and runtime
        run: |
          mkdir -p test-results/sms-linux
          { git rev-parse HEAD; node --version; bun --version; uname -a; openssl version; } | tee test-results/sms-linux/environment.log
          printf 'check\texit_code\n' > test-results/sms-linux/results.tsv
      - name: Install frozen dependencies and workspace outputs
        id: setup
        shell: bash
        run: |
          set -o pipefail
          trap 'result=$?; printf "setup\t%s\n" "$result" >> test-results/sms-linux/results.tsv; exit "$result"' ERR
          bun install --frozen-lockfile --ignore-scripts 2>&1 | tee test-results/sms-linux/install.log
          bun_install_script=$(find node_modules -path '*/bun/install.js' -print -quit)
          if [ -n "$bun_install_script" ]; then
            (cd "$(dirname "$bun_install_script")" && node install.js)
          fi
          bun run postinstall 2>&1 | tee test-results/sms-linux/postinstall.log
          node packages/scripts/ensure-workspace-symlinks.ts
          bun run build:core 2>&1 | tee test-results/sms-linux/build-core.log
          printf 'setup\t0\n' >> test-results/sms-linux/results.tsv
      - name: Focused real HTTP regression with identical test
        id: focused
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          test_file=packages/auth/src/server/__tests__/linked-phone-login.integration.test.ts
          if [ "$CASE_LABEL" = baseline ]; then git show "$PATCH_HEAD:$test_file" > "$test_file"; fi
          set +e
          timeout 300s bun --no-env-file --conditions=eliza-source test "$test_file" packages/auth/src/server/__tests__/blooio-phone-provider.test.ts packages/auth/src/server/__tests__/sms-pumping-guard.test.ts --isolate --timeout 60000 > test-results/sms-linux/focused.log 2>&1
          result=$?
          cat test-results/sms-linux/focused.log
          printf 'focused\t%s\n' "$result" >> test-results/sms-linux/results.tsv
          if [ "$CASE_LABEL" = baseline ]; then git restore --source=HEAD -- "$test_file"; fi
          exit "$result"
      - name: Auth typecheck lint and build
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          failed=0
          for check in typecheck lint build; do
            timeout 600s bun run --cwd packages/auth "$check" > "test-results/sms-linux/$check.log" 2>&1
            result=$?
            cat "test-results/sms-linux/$check.log"
            printf '%s\t%s\n' "$check" "$result" >> test-results/sms-linux/results.tsv
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Auth package suites including deployment package
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          failed=0
          for check in test:credentials test:login test:native-host; do
            timeout 600s bun run --cwd packages/auth "$check" > "test-results/sms-linux/$check.log" 2>&1
            result=$?
            cat "test-results/sms-linux/$check.log"
            printf '%s\t%s\n' "$check" "$result" >> test-results/sms-linux/results.tsv
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Real browser and isolated PostgreSQL
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bunx playwright install chromium > test-results/sms-linux/browser-install.log 2>&1
          browser_install=$?
          cat test-results/sms-linux/browser-install.log
          printf 'browser-install\t%s\n' "$browser_install" >> test-results/sms-linux/results.tsv
          failed=0
          for check in test:browser test:postgres; do
            timeout 600s bun run --cwd packages/auth "$check" > "test-results/sms-linux/$check.log" 2>&1
            result=$?
            cat "test-results/sms-linux/$check.log"
            printf '%s\t%s\n' "$check" "$result" >> test-results/sms-linux/results.tsv
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Full repository verification
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout 1800s bun run verify > test-results/sms-linux/verify.log 2>&1
          result=$?
          cat test-results/sms-linux/verify.log
          printf 'verify\t%s\n' "$result" >> test-results/sms-linux/results.tsv
          git status --short > test-results/sms-linux/final-git-status.log
          exit "$result"
      - name: Upload exact logs and exit codes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sms-linux-${{ matrix.label }}-${{ github.run_attempt }}
          path: test-results/sms-linux/
          retention-days: 14
      - name: Require all applicable checks
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
        shell: bash
        run: |
          test "$SETUP_OUTCOME" = success
          cat test-results/sms-linux/results.tsv
          awk -F '\t' -v kind="$CASE_LABEL" '
            BEGIN { split("setup focused typecheck lint build test:credentials test:login test:native-host browser-install test:browser test:postgres verify", required, " ") }
            NR > 1 {
              seen[$1]++
              expected = (kind == "baseline" && $1 == "focused") ? 1 : 0
              if ($2 != expected) failed=1
            }
            END {
              for (i in required) if (seen[required[i]] != 1) failed=1
              exit failed
            }' test-results/sms-linux/results.tsv
